image: gradle:8.3-jdk17

stages:
  - unit_test

variables:
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/android-sdk"
  ANDROID_HOME: "$CI_PROJECT_DIR/android-sdk"
  PATH: "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

unit-tests-job:
  stage: unit_test
  before_script:
    # Download Android command-line tools
    - mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
    - curl -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
    - unzip cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
    - mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest

    # Accept licenses
    - yes | sdkmanager --licenses

    # Install required SDK packages
    - sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"

    # Make Gradle wrapper executable if present
    - if [ -f ./gradlew ]; then chmod +x ./gradlew; fi
    - if [ -f ./app/gradlew ]; then chmod +x ./app/gradlew; fi

  script:
    # Run unit tests
    - |
      if [ -f ./gradlew ]; then
        ./gradlew testDebugUnitTest --stacktrace
      elif [ -f ./app/gradlew ]; then
        ./app/gradlew testDebugUnitTest --stacktrace
      else
        gradle testDebugUnitTest --stacktrace
      fi

